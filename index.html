<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>Yatzy Scoresheet</title>
  <style>
    :root {
  --bg: #eef2f7;
  --bg-2: #e3e9f2;
  --panel: #ffffff;
  --panel-2: #f6f8fc;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --text: #16233b;
  --muted: #6b7a90;
  --accent: #0ea5a4;
  --accent-2: #0d9488;
  --accent-3: #14b8a6;
  --accent-soft: #d7f5f2;
  --warn: #f59e0b;
  --danger: #ef4444;
  --cell: #ffffff;
  --cell-filled: #ecfbf9;
  --total: #eef6ff;
  --grand: #e0f5f1;
  --shadow: 0 10px 30px rgba(20, 40, 80, .10);
  --shadow-sm: 0 2px 8px rgba(20, 40, 80, .08);
  --max-w: 780px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: linear-gradient(180deg, var(--bg), var(--bg-2));
  background-attachment: fixed;
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  height: 100%;
}

body { display: flex; flex-direction: column; min-height: 100vh; }

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(120deg, #0f766e 0%, #0ea5a4 55%, #22c1a6 100%);
  box-shadow: 0 6px 22px rgba(13, 148, 136, .28);
  border-radius: 0 0 18px 18px;
}
.app-header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: .3px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.15);
}
.app-header h1::before { content: "🎲 "; }
.header-actions { display: flex; gap: 8px; }

/* Buttons */
.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  background: var(--panel-2);
  color: var(--text);
  transition: transform .06s ease, background .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.95); }
.btn-primary {
  background: linear-gradient(120deg, var(--accent-2), var(--accent-3));
  color: #fff;
  box-shadow: 0 4px 14px rgba(13, 148, 136, .35);
}
.btn-primary:hover { box-shadow: 0 6px 18px rgba(13, 148, 136, .45); }
.btn-warn { background: var(--warn); color: #3a2400; }
.btn-ghost { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.35); }
.btn-ghost:hover { background: rgba(255,255,255,.3); }

/* Views */
.view { flex: 1; width: 100%; max-width: var(--max-w); margin: 0 auto; padding: 14px 12px 24px; }
.hidden { display: none !important; }

/* Scoresheet */
.sheet-wrap {
  width: 100%;
  max-height: calc(100vh - var(--header-h, 58px) - 40px);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.sheet {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: max-content;
}
.sheet th, .sheet td {
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  text-align: center;
  white-space: nowrap;
}
.sheet tr td:last-child, .sheet tr th:last-child { border-right: none; }

/* Category column (sticky) */
.cat-col {
  position: sticky;
  left: 0;
  z-index: 5;
  background: var(--panel-2);
  text-align: left;
  padding: 11px 14px;
  min-width: 150px;
  max-width: 48vw;
  font-weight: 700;
  font-size: 14px;
}
.cat-col .cat-help {
  display: block;
  font-weight: 400;
  font-size: 11px;
  color: var(--muted);
  white-space: normal;
  margin-top: 1px;
}

/* Header row */
.sheet thead th {
  position: sticky;
  top: 0;
  z-index: 6;
  background: linear-gradient(180deg, #ffffff, #eef2f8);
  padding: 12px 8px;
  border-bottom: 2px solid var(--line-strong);
}
.sheet thead th.cat-col { z-index: 8; top: 0; }
.player-head {
  min-width: 88px;
  cursor: pointer;
  color: var(--text);
  transition: background .15s ease;
}
.player-head:hover { background: var(--accent-soft); }
.player-head .pname { display: block; font-size: 15px; font-weight: 800; }
.player-head .ptotal {
  display: inline-block;
  margin-top: 4px;
  font-size: 12px;
  font-weight: 800;
  color: var(--accent-2);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 1px 9px;
}

/* Section label rows */
.section-row td {
  background: linear-gradient(90deg, #0f766e, #16b3a4);
  color: #fff;
  text-transform: uppercase;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-align: left;
  padding: 7px 14px;
}

/* Score cells */
.score-cell {
  padding: 0;
  background: var(--cell);
  cursor: pointer;
  height: 48px;
  min-width: 88px;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  transition: background .12s ease, box-shadow .12s ease;
}
.score-cell.filled { background: var(--cell-filled); }
.score-cell.zero { color: var(--muted); font-weight: 600; }
.score-cell:hover { background: var(--accent-soft); }
.score-cell:active { background: #bff0eb; box-shadow: inset 0 0 0 2px var(--accent-3); }

/* Computed rows */
.calc-row td { background: var(--total); font-weight: 800; }
.calc-row .cat-col { background: #e4eefb; }
.calc-val { color: var(--accent-2); font-size: 16px; }
.grand-row td { background: var(--grand); font-size: 17px; }
.grand-row .cat-col { background: #cdeee8; color: #0f5f57; }
.grand-row .calc-val { color: #0f5f57; }

.empty-hint {
  text-align: center;
  color: var(--muted);
  margin-top: 48px;
  font-size: 15px;
}

/* Settings */
.settings { padding: 4px; max-width: 720px; margin: 0 auto; }
.settings-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 14px;
}
.settings-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.settings-block {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.settings-block h3 { margin: 0 0 6px; font-size: 15px; font-weight: 800; }
.muted { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

/* Language switch */
.lang-switch { display: flex; gap: 10px; }
.lang-switch .btn { flex: 1; border: 1px solid var(--line-strong); }
.lang-switch .btn.active {
  background: linear-gradient(120deg, var(--accent-2), var(--accent-3));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(13, 148, 136, .3);
}
.field-row { display: flex; flex-wrap: wrap; gap: 16px; }
.field-row label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 5px; font-weight: 600; }

.num-input, .text-input {
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: 15px;
  width: 92px;
  font-weight: 700;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.num-input:focus, .text-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.text-input { width: 100%; }

/* Category settings list */
.cat-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 4px;
  border-top: 1px solid var(--line);
}
.cat-row:first-child { border-top: none; }
.cat-row .cat-name { flex: 1 1 120px; font-weight: 700; }
.cat-row .cat-name small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: capitalize; }
.cat-row .cat-fields { display: flex; gap: 12px; align-items: center; }
.cat-row .cat-fields label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; font-weight: 600; }
.switch { position: relative; display: inline-block; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0;
  background: #cbd5e1; border-radius: 28px; transition: .2s;
}
.slider::before {
  content: ""; position: absolute; height: 22px; width: 22px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .slider { background: linear-gradient(120deg, var(--accent-2), var(--accent-3)); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(15, 30, 55, .45);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--panel);
  width: 100%;
  max-width: 480px;
  border-radius: 22px 22px 0 0;
  padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -10px 40px rgba(15, 30, 55, .3);
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(24px); opacity: .5; } to { transform: none; opacity: 1; } }
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; text-align: center; }
.modal-help { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 14px; min-height: 14px; }
.modal-help.error { color: var(--danger); font-weight: 800; }

.keypad-display {
  background: var(--accent-soft);
  border: 1px solid var(--accent-3);
  color: var(--accent-2);
  border-radius: 14px;
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  padding: 12px;
  margin-bottom: 14px;
}
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.key {
  padding: 17px 0;
  font-size: 21px;
  font-weight: 800;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  transition: transform .05s ease, background .12s ease;
}
.key:active { transform: scale(.94); background: var(--accent-soft); }
.key-alt { background: #e7edf5; color: var(--muted); }

.big-btn {
  display: block;
  width: 100%;
  padding: 18px;
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 800;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  transition: transform .05s ease, background .12s ease, box-shadow .12s ease;
}
.big-btn:active { transform: scale(.98); background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent-3); }

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}
.modal-actions .btn { flex: 1 1 auto; }
.modal-actions .btn-primary { flex: 2 1 auto; }

@media (min-width: 520px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 22px; }
}

  </style>
</head>
<body>
  <header class="app-header">
    <h1>Yatzy</h1>
    <div class="header-actions">
      <button id="btn-add-player" class="btn btn-ghost" data-i18n="addPlayer">+ Spieler</button>
      <button id="btn-settings" class="btn btn-ghost" title="Einstellungen">⚙</button>
      <button id="btn-new-game" class="btn btn-ghost" title="Neues Spiel">↺</button>
    </div>
  </header>

  <!-- Scoresheet -->
  <main id="view-game" class="view">
    <div id="sheet-wrap" class="sheet-wrap">
      <table id="sheet" class="sheet"></table>
    </div>
    <p id="empty-hint" class="empty-hint" data-i18n="emptyHint">Füge einen Spieler hinzu, um zu punkten.</p>
  </main>

  <!-- Settings -->
  <main id="view-settings" class="view hidden">
    <div class="settings">
      <div class="settings-head">
        <button id="btn-back" class="btn btn-ghost" data-i18n="back">← Zurück</button>
        <h2 data-i18n="settingsTitle">Einstellungen</h2>
        <button id="btn-reset-settings" class="btn btn-ghost" data-i18n="resetDefaults">Zurücksetzen</button>
      </div>

      <section class="settings-block">
        <h3 data-i18n="language">Sprache</h3>
        <div class="lang-switch">
          <button id="lang-de" class="btn" data-lang="de">Deutsch</button>
          <button id="lang-en" class="btn" data-lang="en">English</button>
        </div>
      </section>

      <section class="settings-block">
        <h3 data-i18n="bonusBlock">Bonus im oberen Teil</h3>
        <div class="field-row">
          <label><span data-i18n="bonusIf">Bonus wenn obere Summe ≥</span>
            <input type="number" id="bonus-threshold" class="num-input" min="0" />
          </label>
          <label><span data-i18n="bonusPoints">Bonuspunkte</span>
            <input type="number" id="bonus-value" class="num-input" min="0" />
          </label>
        </div>
      </section>

      <section class="settings-block">
        <h3 data-i18n="categories">Kategorien</h3>
        <p class="muted" data-i18n="categoriesHelp">Wähle, welche Kategorien verwendet werden, und bearbeite ihre Punktwerte. „Serviert“ = im ersten Wurf erreicht.</p>
        <div id="cat-settings" class="cat-settings"></div>
      </section>
    </div>
  </main>

  <!-- Score entry modal -->
  <div id="modal-score" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-player"></span> · <span id="modal-cat"></span>
      </div>
      <div id="modal-help" class="modal-help"></div>

      <div id="modal-count" class="modal-body">
        <div id="keypad-display" class="keypad-display">0</div>
        <div class="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>
          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>
          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>
          <button class="key key-alt" data-key="back">⌫</button>
          <button class="key" data-key="0">0</button>
          <button class="key key-alt" data-key="clear">C</button>
        </div>
      </div>

      <div id="modal-fixed" class="modal-body hidden">
        <button id="fixed-points" class="big-btn"></button>
        <button id="fixed-served" class="big-btn"></button>
      </div>

      <div class="modal-actions">
        <button id="modal-scratch" class="btn btn-warn" data-i18n="scratch">Streichen (0)</button>
        <button id="modal-unset" class="btn btn-ghost" data-i18n="clear">Leeren</button>
        <button id="modal-cancel" class="btn btn-ghost" data-i18n="cancel">Abbrechen</button>
        <button id="modal-save" class="btn btn-primary" data-i18n="save">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Text input modal (player names) -->
  <div id="modal-text" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title" id="text-title"></div>
      <input type="text" id="text-input" class="text-input" autocomplete="off" />
      <div class="modal-actions">
        <button id="text-delete" class="btn btn-warn hidden" data-i18n="removePlayer">Spieler entfernen</button>
        <button id="text-cancel" class="btn btn-ghost" data-i18n="cancel">Abbrechen</button>
        <button id="text-save" class="btn btn-primary" data-i18n="save">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    /* ===== Yatzy Scoresheet ===== */

const LS_SETTINGS = 'yatzy_settings_v1';
const LS_GAME = 'yatzy_game_v1';

const DEFAULT_SETTINGS = {
  bonusThreshold: 63,
  bonusValue: 35,
  categories: [
    { id: 'ones',   label: 'Ones',   section: 'upper', type: 'count', max: 5,  enabled: true, help: 'Count only the ones' },
    { id: 'twos',   label: 'Twos',   section: 'upper', type: 'count', max: 10, enabled: true, help: 'Count only the twos' },
    { id: 'threes', label: 'Threes', section: 'upper', type: 'count', max: 15, enabled: true, help: 'Count only the threes' },
    { id: 'fours',  label: 'Fours',  section: 'upper', type: 'count', max: 20, enabled: true, help: 'Count only the fours' },
    { id: 'fives',  label: 'Fives',  section: 'upper', type: 'count', max: 25, enabled: true, help: 'Count only the fives' },
    { id: 'sixes',  label: 'Sixes',  section: 'upper', type: 'count', max: 30, enabled: true, help: 'Count only the sixes' },
    { id: 'one_pair',       label: 'One Pair',        section: 'lower', type: 'count', max: 30, enabled: true, help: 'Any pair — count all five dice' },
    { id: 'two_pairs',      label: 'Two Pairs',       section: 'lower', type: 'count', max: 30, enabled: true, help: 'Two pairs — count all five dice' },
    { id: 'three_kind',     label: 'Three of a Kind', section: 'lower', type: 'count', max: 30, enabled: true, help: 'Three of a kind — count all five dice' },
    { id: 'four_kind',      label: 'Four of a Kind',  section: 'lower', type: 'count', max: 30, enabled: true, help: 'Four of a kind — count all five dice' },
    { id: 'full_house',     label: 'Full House',      section: 'lower', type: 'fixed', points: 25, served: 30, enabled: true, help: 'One pair + three of a kind' },
    { id: 'small_straight', label: 'Small Straight',  section: 'lower', type: 'fixed', points: 30, served: 35, enabled: true, help: 'Four in a row' },
    { id: 'large_straight', label: 'Large Straight',  section: 'lower', type: 'fixed', points: 40, served: 45, enabled: true, help: 'Five in a row' },
    { id: 'yatzy',          label: 'Yatzy',           section: 'lower', type: 'fixed', points: 50, served: 80, enabled: true, help: 'Five of a kind' },
    { id: 'chance',         label: 'Chance',          section: 'lower', type: 'count', max: 30, enabled: true, help: 'Any five dice — count all' },
  ],
};

const UPPER_IDS = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];

// Face value (1-6) for an upper-section category, or null for others.
function faceFor(cat) {
  const i = UPPER_IDS.indexOf(cat.id);
  return i === -1 ? null : i + 1;
}

let lang = localStorage.getItem(LS_LANG) || 'de';
if (!I18N[lang]) lang = 'de';

function t(key) { return I18N[lang][key]; }
function catLabel(cat) { return (I18N[lang].cats[cat.id] || {}).label || cat.label || cat.id; }
function catHelp(cat) { return (I18N[lang].cats[cat.id] || {}).help || cat.help || ''; }

// Apply all static [data-i18n] text and update the <html lang> attribute.
function applyStaticI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t(el.dataset.i18n);
    if (typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('.lang-switch .btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function setLang(newLang) {
  if (!I18N[newLang]) return;
  lang = newLang;
  localStorage.setItem(LS_LANG, lang);
  applyStaticI18n();
  renderSheet();
  if (!viewSettings.classList.contains('hidden')) renderCatSettings();
}

let settings, game;

/* ---------- Persistence ---------- */
function load() {
  try {
    settings = JSON.parse(localStorage.getItem(LS_SETTINGS)) || null;
  } catch { settings = null; }
  if (!settings || !Array.isArray(settings.categories)) {
    settings = structuredClone(DEFAULT_SETTINGS);
  } else {
    // merge in any new default categories not present (forward compatibility)
    const known = new Set(settings.categories.map(c => c.id));
    for (const def of DEFAULT_SETTINGS.categories) {
      if (!known.has(def.id)) settings.categories.push(structuredClone(def));
    }
    if (settings.bonusThreshold == null) settings.bonusThreshold = DEFAULT_SETTINGS.bonusThreshold;
    if (settings.bonusValue == null) settings.bonusValue = DEFAULT_SETTINGS.bonusValue;
  }

  try {
    game = JSON.parse(localStorage.getItem(LS_GAME)) || null;
  } catch { game = null; }
  if (!game || !Array.isArray(game.players)) {
    game = { players: [], scores: {} };
  }
}

function saveSettings() { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }
function saveGame() { localStorage.setItem(LS_GAME, JSON.stringify(game)); }

/* ---------- Helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 9); }
function enabledCats() { return settings.categories.filter(c => c.enabled); }
function getScore(playerId, catId) {
  const s = game.scores[playerId];
  return s && s[catId] != null ? s[catId] : null;
}
function setScore(playerId, catId, value) {
  if (!game.scores[playerId]) game.scores[playerId] = {};
  if (value == null) delete game.scores[playerId][catId];
  else game.scores[playerId][catId] = value;
  saveGame();
}

function upperSum(playerId) {
  let sum = 0;
  for (const id of UPPER_IDS) {
    const cat = settings.categories.find(c => c.id === id);
    if (!cat || !cat.enabled) continue;
    const v = getScore(playerId, id);
    if (v != null) sum += v;
  }
  return sum;
}
function bonusFor(playerId) {
  return upperSum(playerId) >= settings.bonusThreshold ? settings.bonusValue : 0;
}
function lowerSum(playerId) {
  let sum = 0;
  for (const cat of enabledCats()) {
    if (cat.section !== 'lower') continue;
    const v = getScore(playerId, cat.id);
    if (v != null) sum += v;
  }
  return sum;
}
function grandTotal(playerId) {
  return upperSum(playerId) + bonusFor(playerId) + lowerSum(playerId);
}

/* ---------- Render scoresheet ---------- */
const sheetEl = document.getElementById('sheet');
const emptyHint = document.getElementById('empty-hint');

function renderSheet() {
  const players = game.players;
  emptyHint.classList.toggle('hidden', players.length > 0);
  sheetEl.innerHTML = '';
  if (players.length === 0) return;

  // Header
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  hr.appendChild(th('', 'cat-col'));
  players.forEach(p => {
    const cell = document.createElement('th');
    cell.className = 'player-head';
    cell.innerHTML = `<span class="pname"></span><span class="ptotal">${grandTotal(p.id)}</span>`;
    cell.querySelector('.pname').textContent = p.name;
    cell.onclick = () => openNameModal(p);
    hr.appendChild(cell);
  });
  thead.appendChild(hr);
  sheetEl.appendChild(thead);

  const tbody = document.createElement('tbody');

  // Upper section
  tbody.appendChild(sectionRow(t('sectionUpper'), players.length));
  for (const cat of settings.categories) {
    if (cat.section !== 'upper' || !cat.enabled) continue;
    tbody.appendChild(scoreRow(cat, players));
  }
  tbody.appendChild(calcRow(t('sumUpper'), players, upperSum));
  tbody.appendChild(calcRow(`${t('bonus')} (≥ ${settings.bonusThreshold} → ${settings.bonusValue})`, players, bonusFor));

  // Lower section
  for (const cat of settings.categories) {
    if (cat.section !== 'lower' || !cat.enabled) continue;
    tbody.appendChild(scoreRow(cat, players));
  }

  tbody.appendChild(calcRow(t('total'), players, grandTotal, true));

  sheetEl.appendChild(tbody);
}

function th(text, cls) {
  const el = document.createElement('th');
  if (cls) el.className = cls;
  el.textContent = text;
  return el;
}

function sectionRow(label, colCount) {
  const tr = document.createElement('tr');
  tr.className = 'section-row';
  const td = document.createElement('td');
  td.colSpan = colCount + 1;
  td.textContent = label;
  tr.appendChild(td);
  return tr;
}

function scoreRow(cat, players) {
  const tr = document.createElement('tr');
  const nameTd = document.createElement('td');
  nameTd.className = 'cat-col';
  nameTd.innerHTML = `<span class="cat-label"></span><span class="cat-help"></span>`;
  nameTd.querySelector('.cat-label').textContent = catLabel(cat);
  nameTd.querySelector('.cat-help').textContent = catHelp(cat);
  tr.appendChild(nameTd);

  players.forEach(p => {
    const td = document.createElement('td');
    td.className = 'score-cell';
    const v = getScore(p.id, cat.id);
    if (v != null) {
      td.textContent = v;
      td.classList.add('filled');
      if (v === 0) td.classList.add('zero');
    } else {
      td.textContent = '';
    }
    td.onclick = () => openScoreModal(p, cat);
    tr.appendChild(td);
  });
  return tr;
}

function calcRow(label, players, fn, grand) {
  const tr = document.createElement('tr');
  tr.className = 'calc-row' + (grand ? ' grand-row' : '');
  const nameTd = document.createElement('td');
  nameTd.className = 'cat-col';
  nameTd.textContent = label;
  tr.appendChild(nameTd);
  players.forEach(p => {
    const td = document.createElement('td');
    td.className = 'calc-val';
    td.textContent = fn(p.id);
    tr.appendChild(td);
  });
  return tr;
}

/* ---------- Score entry modal ---------- */
const modalScore = document.getElementById('modal-score');
const modalPlayer = document.getElementById('modal-player');
const modalCat = document.getElementById('modal-cat');
const modalHelp = document.getElementById('modal-help');
const modalCountBody = document.getElementById('modal-count');
const modalFixedBody = document.getElementById('modal-fixed');
const keypadDisplay = document.getElementById('keypad-display');
const fixedPointsBtn = document.getElementById('fixed-points');
const fixedServedBtn = document.getElementById('fixed-served');

let modalState = null; // { player, cat, value }

function openScoreModal(player, cat) {
  modalState = { player, cat, value: getScore(player.id, cat.id) };
  modalPlayer.textContent = player.name;
  modalCat.textContent = catLabel(cat);
  const face = faceFor(cat);
  modalHelp.classList.remove('error');
  modalHelp.textContent = face
    ? `${catHelp(cat)} · ${t('multiples')(face, face * 5)}`
    : catHelp(cat);

  if (cat.type === 'fixed') {
    modalCountBody.classList.add('hidden');
    modalFixedBody.classList.remove('hidden');
    fixedPointsBtn.textContent = t('pointsBtn')(cat.points);
    fixedServedBtn.textContent = t('servedBtn')(cat.served);
    fixedPointsBtn.onclick = () => { modalState.value = cat.points; commitScore(); };
    fixedServedBtn.onclick = () => { modalState.value = cat.served; commitScore(); };
  } else {
    modalFixedBody.classList.add('hidden');
    modalCountBody.classList.remove('hidden');
    keypadDisplay.textContent = modalState.value != null ? String(modalState.value) : '0';
  }
  modalScore.classList.remove('hidden');
}

function closeScoreModal() {
  modalScore.classList.add('hidden');
  modalState = null;
}

// An upper-section count is valid only if it's a multiple of its face, up to 5×face.
function isValidUpper(cat, value) {
  const face = faceFor(cat);
  if (face == null || value == null) return true;
  return value >= 0 && value <= face * 5 && value % face === 0;
}

function commitScore() {
  if (!modalState) return;
  const val = modalState.value;
  if (val != null && modalState.cat.type !== 'fixed' && !isValidUpper(modalState.cat, val)) {
    const face = faceFor(modalState.cat);
    modalHelp.textContent = t('invalid')(face, face * 5);
    modalHelp.classList.add('error');
    return; // reject: leave the modal open and don't store the value
  }
  setScore(modalState.player.id, modalState.cat.id, val);
  closeScoreModal();
  renderSheet();
}

// Keypad
document.querySelectorAll('.keypad .key').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!modalState) return;
    const key = btn.dataset.key;
    let cur = keypadDisplay.textContent;
    if (key === 'clear') {
      cur = '0';
    } else if (key === 'back') {
      cur = cur.length > 1 ? cur.slice(0, -1) : '0';
    } else {
      cur = cur === '0' ? key : cur + key;
      if (cur.length > 3) cur = cur.slice(0, 3); // cap
    }
    keypadDisplay.textContent = cur;
    modalState.value = parseInt(cur, 10);
  });
});

document.getElementById('modal-save').onclick = () => {
  if (!modalState) return;
  if (modalState.cat.type !== 'fixed') {
    modalState.value = parseInt(keypadDisplay.textContent, 10) || 0;
  }
  if (modalState.value == null) modalState.value = 0;
  commitScore();
};
document.getElementById('modal-scratch').onclick = () => {
  if (!modalState) return;
  modalState.value = 0;
  commitScore();
};
document.getElementById('modal-unset').onclick = () => {
  if (!modalState) return;
  modalState.value = null;
  commitScore();
};
document.getElementById('modal-cancel').onclick = closeScoreModal;
modalScore.addEventListener('click', e => { if (e.target === modalScore) closeScoreModal(); });

// Physical keyboard support (desktop)
document.addEventListener('keydown', e => {
  if (modalScore.classList.contains('hidden') || !modalState) return;
  if (e.key === 'Escape') { e.preventDefault(); closeScoreModal(); return; }
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modal-save').click(); return; }
  if (modalState.cat.type === 'fixed') return;
  let cur = keypadDisplay.textContent;
  if (/^[0-9]$/.test(e.key)) {
    cur = cur === '0' ? e.key : cur + e.key;
    if (cur.length > 3) cur = cur.slice(0, 3);
  } else if (e.key === 'Backspace') {
    cur = cur.length > 1 ? cur.slice(0, -1) : '0';
  } else {
    return;
  }
  e.preventDefault();
  keypadDisplay.textContent = cur;
  modalState.value = parseInt(cur, 10);
});

/* ---------- Player name modal ---------- */
const modalText = document.getElementById('modal-text');
const textTitle = document.getElementById('text-title');
const textInput = document.getElementById('text-input');
const textDelete = document.getElementById('text-delete');

let editingPlayer = null;

function openNameModal(player) {
  editingPlayer = player || null;
  textTitle.textContent = player ? t('editPlayer') : t('newPlayer');
  textInput.value = player ? player.name : '';
  textInput.placeholder = t('playerN')(game.players.length + 1);
  textDelete.classList.toggle('hidden', !player);
  modalText.classList.remove('hidden');
  setTimeout(() => textInput.focus(), 50);
}
function closeNameModal() {
  modalText.classList.add('hidden');
  editingPlayer = null;
}
document.getElementById('text-cancel').onclick = closeNameModal;
document.getElementById('text-save').onclick = () => {
  const name = textInput.value.trim() || textInput.placeholder;
  if (editingPlayer) {
    editingPlayer.name = name;
  } else {
    game.players.push({ id: uid(), name });
  }
  saveGame();
  closeNameModal();
  renderSheet();
};
document.getElementById('text-delete').onclick = () => {
  if (!editingPlayer) return;
  if (!confirm(t('removeConfirm')(editingPlayer.name))) return;
  game.players = game.players.filter(p => p.id !== editingPlayer.id);
  delete game.scores[editingPlayer.id];
  saveGame();
  closeNameModal();
  renderSheet();
};
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('text-save').click(); });
modalText.addEventListener('click', e => { if (e.target === modalText) closeNameModal(); });

/* ---------- Settings view ---------- */
const viewGame = document.getElementById('view-game');
const viewSettings = document.getElementById('view-settings');
const catSettingsEl = document.getElementById('cat-settings');
const bonusThresholdInput = document.getElementById('bonus-threshold');
const bonusValueInput = document.getElementById('bonus-value');

function openSettings() {
  bonusThresholdInput.value = settings.bonusThreshold;
  bonusValueInput.value = settings.bonusValue;
  renderCatSettings();
  viewGame.classList.add('hidden');
  viewSettings.classList.remove('hidden');
}
function closeSettings() {
  viewSettings.classList.add('hidden');
  viewGame.classList.remove('hidden');
  renderSheet();
}

function renderCatSettings() {
  catSettingsEl.innerHTML = '';
  settings.categories.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'cat-row';

    const sw = document.createElement('label');
    sw.className = 'switch';
    sw.innerHTML = `<input type="checkbox" ${cat.enabled ? 'checked' : ''}><span class="slider"></span>`;
    sw.querySelector('input').onchange = e => { cat.enabled = e.target.checked; saveSettings(); };
    row.appendChild(sw);

    const name = document.createElement('div');
    name.className = 'cat-name';
    name.innerHTML = `<span></span><small>${t('section_' + cat.section)} · ${t('type_' + cat.type)}</small>`;
    name.querySelector('span').textContent = catLabel(cat);
    row.appendChild(name);

    if (cat.type === 'fixed') {
      const fields = document.createElement('div');
      fields.className = 'cat-fields';
      fields.appendChild(numField(t('points'), cat.points, v => { cat.points = v; saveSettings(); }));
      fields.appendChild(numField(t('served'), cat.served, v => { cat.served = v; saveSettings(); }));
      row.appendChild(fields);
    }

    catSettingsEl.appendChild(row);
  });
}

function numField(label, value, onChange) {
  const wrap = document.createElement('label');
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'num-input';
  input.value = value;
  input.min = '0';
  input.onchange = () => onChange(parseInt(input.value, 10) || 0);
  wrap.append(label, input);
  return wrap;
}

bonusThresholdInput.onchange = () => { settings.bonusThreshold = parseInt(bonusThresholdInput.value, 10) || 0; saveSettings(); };
bonusValueInput.onchange = () => { settings.bonusValue = parseInt(bonusValueInput.value, 10) || 0; saveSettings(); };

document.getElementById('btn-reset-settings').onclick = () => {
  if (!confirm(t('resetConfirm'))) return;
  settings = structuredClone(DEFAULT_SETTINGS);
  saveSettings();
  openSettings();
};

document.querySelectorAll('.lang-switch .btn').forEach(btn => {
  btn.onclick = () => setLang(btn.dataset.lang);
});

/* ---------- Top-level actions ---------- */
document.getElementById('btn-add-player').onclick = () => openNameModal(null);
document.getElementById('btn-settings').onclick = openSettings;
document.getElementById('btn-back').onclick = closeSettings;
document.getElementById('btn-new-game').onclick = () => {
  if (!confirm(t('newGameConfirm'))) return;
  game.scores = {};
  saveGame();
  renderSheet();
};

/* ---------- Init ---------- */
function syncHeaderHeight() {
  const h = document.querySelector('.app-header').offsetHeight;
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

load();
applyStaticI18n();
syncHeaderHeight();
renderSheet();

  </script>
