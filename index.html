<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f766e" />
  <title>Yatzy Scoresheet</title>
  <link rel="stylesheet" href="docs/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Yatzy</h1>
    <div class="header-actions">
      <button id="btn-add-player" class="btn btn-ghost" data-i18n="addPlayer">+ Spieler</button>
      <button id="btn-settings" class="btn btn-ghost" title="Einstellungen">⚙</button>
      <button id="btn-new-game" class="btn btn-ghost" title="Neues Spiel">↺</button>
    </div>
  </header>

  <!-- Scoresheet -->
  <main id="view-game" class="view">
    <div id="sheet-wrap" class="sheet-wrap">
      <table id="sheet" class="sheet"></table>
    </div>
    <p id="empty-hint" class="empty-hint" data-i18n="emptyHint">Füge einen Spieler hinzu, um zu punkten.</p>
  </main>

  <!-- Settings -->
  <main id="view-settings" class="view hidden">
    <div class="settings">
      <div class="settings-head">
        <button id="btn-back" class="btn btn-ghost" data-i18n="back">← Zurück</button>
        <h2 data-i18n="settingsTitle">Einstellungen</h2>
        <button id="btn-reset-settings" class="btn btn-ghost" data-i18n="resetDefaults">Zurücksetzen</button>
      </div>

      <section class="settings-block">
        <h3 data-i18n="language">Sprache</h3>
        <div class="lang-switch">
          <button id="lang-de" class="btn" data-lang="de">Deutsch</button>
          <button id="lang-en" class="btn" data-lang="en">English</button>
        </div>
      </section>

      <section class="settings-block">
        <h3 data-i18n="bonusBlock">Bonus im oberen Teil</h3>
        <div class="field-row">
          <label><span data-i18n="bonusIf">Bonus wenn obere Summe ≥</span>
            <input type="number" id="bonus-threshold" class="num-input" min="0" />
          </label>
          <label><span data-i18n="bonusPoints">Bonuspunkte</span>
            <input type="number" id="bonus-value" class="num-input" min="0" />
          </label>
        </div>
      </section>

      <section class="settings-block">
        <h3 data-i18n="categories">Kategorien</h3>
        <p class="muted" data-i18n="categoriesHelp">Wähle, welche Kategorien verwendet werden, und bearbeite ihre Punktwerte. „Serviert“ = im ersten Wurf erreicht.</p>
        <div id="cat-settings" class="cat-settings"></div>
      </section>
    </div>
  </main>

  <!-- Score entry modal -->
  <div id="modal-score" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-player"></span> · <span id="modal-cat"></span>
      </div>
      <div id="modal-help" class="modal-help"></div>

      <div id="modal-count" class="modal-body">
        <div id="keypad-display" class="keypad-display">0</div>
        <div class="keypad">
          <button class="key" data-key="1">1</button>
          <button class="key" data-key="2">2</button>
          <button class="key" data-key="3">3</button>
          <button class="key" data-key="4">4</button>
          <button class="key" data-key="5">5</button>
          <button class="key" data-key="6">6</button>
          <button class="key" data-key="7">7</button>
          <button class="key" data-key="8">8</button>
          <button class="key" data-key="9">9</button>
          <button class="key key-alt" data-key="back">⌫</button>
          <button class="key" data-key="0">0</button>
          <button class="key key-alt" data-key="clear">C</button>
        </div>
      </div>

      <div id="modal-fixed" class="modal-body hidden">
        <button id="fixed-points" class="big-btn"></button>
        <button id="fixed-served" class="big-btn"></button>
      </div>

      <div class="modal-actions">
        <button id="modal-scratch" class="btn btn-warn" data-i18n="scratch">Streichen (0)</button>
        <button id="modal-unset" class="btn btn-ghost" data-i18n="clear">Leeren</button>
        <button id="modal-cancel" class="btn btn-ghost" data-i18n="cancel">Abbrechen</button>
        <button id="modal-save" class="btn btn-primary" data-i18n="save">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Text input modal (player names) -->
  <div id="modal-text" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title" id="text-title"></div>
      <input type="text" id="text-input" class="text-input" autocomplete="off" />
      <div class="modal-actions">
        <button id="text-delete" class="btn btn-warn hidden" data-i18n="removePlayer">Spieler entfernen</button>
        <button id="text-cancel" class="btn btn-ghost" data-i18n="cancel">Abbrechen</button>
        <button id="text-save" class="btn btn-primary" data-i18n="save">Speichern</button>
      </div>
    </div>
  </div>

  <script src="docs/app.js"></script>
</body>
</html>
